<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>캐릭터 검색</title>
    <link rel="stylesheet" href="./static/style.css" />
  </head>
  <body>
    <header class="search-header">
      <nav class="nav-bar">
        <a href="index.html">캐릭터 검색</a>
        <a href="market.html">마켓</a>
        <a href="bid.html">입찰 계산기</a>
      </nav>
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="캐릭터 이름을 입력하세요"
        />
        <button id="searchButton">검색</button>
      </div>
    </header>

    <div class="container" id="characterContainer" style="display: none">
      <header class="profile-header">
        <img id="charImage" class="profile-img" src="" alt="캐릭터 이미지" />
        <div class="profile-info">
          <h1 id="charName"></h1>
          <p id="charDetails"></p>
        </div>
      </header>

      <section class="stats-section">
        <h2>능력치</h2>
        <div class="stats-grid" id="statsList"></div>
      </section>

      <section class="equipment-section">
        <h2>장비</h2>
        <div class="equipment-grid" id="equipmentList"></div>
      </section>

      <section class="accessory-section">
        <h2>악세서리</h2>
        <div class="accessory-grid" id="accessoryList"></div>
      </section>

      <section class="avatar-section">
        <h2>캐릭터 아바타</h2>
        <div class="avatar-grid" id="avatarList"></div>
      </section>

      <section class="gem-section">
        <h2>보석</h2>
        <div class="gem-grid" id="gemList"></div>
      </section>
    </div>

    <script src="./static/script.js"></script>
  </body>
</html>
