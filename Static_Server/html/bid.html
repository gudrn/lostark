<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>입찰 계산기</title>
    <link rel="stylesheet" href="./static/style.css" />
  </head>
  <body>
    <header class="bid-header">
      <nav class="nav-bar">
        <a href="index.html">캐릭터 검색</a>
        <a href="market.html">마켓</a>
        <a href="bid.html">입찰 계산기</a>
      </nav>
      <h1>입찰 계산기</h1>
    </header>

    <main class="container">
      <section class="bid-section">
        <label>각인서 이름:</label>
        <input type="text" id="engravingName" placeholder="예: 원한" />
        <button id="searchEngraving">가격 불러오기</button>

        <label>아이템 가격(G):</label>
        <input
          type="number"
          id="itemPrice"
          placeholder="가격을 입력하거나 각인서 검색"
        />

        <label>파티 인원:</label>
        <div class="party-options">
          <label
            ><input type="radio" name="partySize" value="4" checked />
            4명</label
          >
          <label><input type="radio" name="partySize" value="8" /> 8명</label>
          <label><input type="radio" name="partySize" value="16" /> 16명</label>
        </div>

        <button id="calculateButton">계산하기</button>

        <div id="result" class="result-box"></div>
      </section>
    </main>

    <script src="./static/bid.js"></script>
  </body>
</html>
